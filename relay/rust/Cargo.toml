[package]
name = "arut"
version = "0.0.2-beta"
authors = ["hamzabellouch"]
edition = "2021"

[lib]
name = "relaylib"
path = "src/lib.rs"

[dependencies]
mio = "0.6"       # for async I/O
slab = "0.4.9"    # helper for mio Tokens
log = "0.4.22"    # for logs
chrono = "0.4.38" # for formatting timestamp in logs
byteorder = "1.5.0" # for reading/writing binary
rand = "0.8.5"    # for random TCP sequence number
ctrlc = { version = "3.4.5", features = ["termination"] } # for handling Ctrl+C

[profile.release]
lto = true     # link-time optimization
